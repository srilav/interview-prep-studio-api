syntax = "proto3";

package prepstudio.catalog.v1;

option java_multiple_files = true;
option java_package = "dev.prepstudio.api.catalog.v1";

// ---------- Shared types ----------

enum PlatformKind {
  PLATFORM_KIND_UNSPECIFIED = 0;
  LANGUAGE = 1;
  FRAMEWORK = 2;
  PLATFORM = 3;
  TOOL = 4;
}

enum Difficulty {
  DIFFICULTY_UNSPECIFIED = 0;
  EASY = 1;
  MEDIUM = 2;
  HARD = 3;
}

enum KeyStatus {
  KEY_STATUS_UNSPECIFIED = 0;
  DRAFT = 1;
  IN_REVIEW = 2;
  PUBLISHED = 3;
}

message Platform {
  string id = 1;
  string name = 2;
  PlatformKind kind = 3;
  repeated Category categories = 4;
}

message Category {
  string id = 1;
  string name = 2;
  repeated Subcategory subcategories = 3;
}

message Subcategory {
  string id = 1;
  string name = 2;
  int32 key_count = 3;
}

message Tree {
  repeated Platform platforms = 1;
}

// Where a key sits in the taxonomy. Names are denormalised for display.
message KeyPath {
  string platform_id = 1;
  string platform_name = 2;
  string category_id = 3;
  string category_name = 4;
  string subcategory_id = 5;
  string subcategory_name = 6;
}

// A "key" is an interview term or concept with its definition.
message Key {
  string id = 1;
  string subcategory_id = 2;
  string term = 3;
  repeated string aliases = 4;
  string short_definition = 5; // at most 280 characters
  string detail = 6;           // markdown
  string java_example = 7;
  Difficulty difficulty = 8;
  KeyStatus status = 9;
  repeated string tags = 10;
  repeated string related_terms = 11;
  KeyPath path = 12;           // output only
}

// ---------- Admin: taxonomy and keys ----------

service TaxonomyAdminService {
  rpc ListTree(ListTreeRequest) returns (Tree);
  rpc CreatePlatform(CreatePlatformRequest) returns (Platform);
  rpc CreateCategory(CreateCategoryRequest) returns (Category);
  rpc CreateSubcategory(CreateSubcategoryRequest) returns (Subcategory);

  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
  rpc UpsertKey(UpsertKeyRequest) returns (Key);
  rpc MoveKey(MoveKeyRequest) returns (Key);
  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse);

  // Asks the LLM to draft the short definition, detail and Java example for a term.
  rpc GenerateKeyDraft(GenerateKeyDraftRequest) returns (KeyDraft);
}

message ListTreeRequest {}

message CreatePlatformRequest {
  string name = 1;
  PlatformKind kind = 2;
}

message CreateCategoryRequest {
  string platform_id = 1;
  string name = 2;
}

message CreateSubcategoryRequest {
  string platform_id = 1;
  string category_id = 2;
  string name = 3;
}

message ListKeysRequest {
  string subcategory_id = 1;
  KeyStatus status = 2; // KEY_STATUS_UNSPECIFIED = all
}

message ListKeysResponse {
  repeated Key keys = 1;
}

// Creates the key when key.id is empty, otherwise updates it.
message UpsertKeyRequest {
  Key key = 1;
}

message MoveKeyRequest {
  string key_id = 1;
  string target_subcategory_id = 2;
}

message DeleteKeyRequest {
  string key_id = 1;
}

message DeleteKeyResponse {}

message GenerateKeyDraftRequest {
  string subcategory_id = 1;
  string term = 2;
  Difficulty difficulty = 3;
}

message KeyDraft {
  string short_definition = 1;
  string detail = 2;
  string java_example = 3;
}

// ---------- Learner: lookup ----------

service CatalogService {
  // Searches published keys by term and alias.
  rpc SearchKeys(SearchKeysRequest) returns (SearchKeysResponse);
  rpc GetKey(GetKeyRequest) returns (Key);
}

message SearchKeysRequest {
  string query = 1;
  string platform_id = 2; // optional filter
  int32 limit = 3;        // default 20, max 100
}

message SearchKeysResponse {
  repeated Key keys = 1;
}

message GetKeyRequest {
  string key_id = 1;
}
