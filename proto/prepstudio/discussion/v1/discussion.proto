syntax = "proto3";

package prepstudio.discussion.v1;

option java_multiple_files = true;
option java_package = "dev.prepstudio.api.discussion.v1";

// Thread management and history over gRPC. Live posting and AI tutor replies
// go over WebSocket (STOMP), because gRPC-Web has no bidirectional streaming:
//   send      /app/threads/{threadId}/messages   {"author": "...", "content": "..."}
//   subscribe /topic/threads/{threadId}          {"type": "message" | "ai_chunk" | "ai_error", ...}
service DiscussionService {
  rpc OpenThread(OpenThreadRequest) returns (Thread);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
}

message Thread {
  string id = 1;
  string key_id = 2;
  string title = 3;
  string opened_by = 4;
  bool closed = 5;
  string opened_at = 6; // ISO-8601
}

message Message {
  string id = 1;
  string thread_id = 2;
  string author = 3;
  bool from_ai_tutor = 4;
  string content = 5;
  string posted_at = 6; // ISO-8601
}

message OpenThreadRequest {
  string key_id = 1;
  string title = 2;
  string opened_by = 3;
}

message ListThreadsRequest {
  string key_id = 1;
}

message ListThreadsResponse {
  repeated Thread threads = 1;
}

message ListMessagesRequest {
  string thread_id = 1;
  int32 limit = 2; // default 100
}

message ListMessagesResponse {
  repeated Message messages = 1;
}
